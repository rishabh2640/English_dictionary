<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>English Dictionary</title>
    <!-- Google Fonts -->
    <link rel="preconnect" href="https://fonts.googleapis.com">
    <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
    <link href="https://fonts.googleapis.com/css2?family=Inter:wght@300;400;500;600;700&display=swap" rel="stylesheet">
    <!-- Font Awesome -->
    <link rel="stylesheet" href="https://cdnjs.cloudflare.com/ajax/libs/font-awesome/6.4.0/css/all.min.css">
    <!-- Styles -->
    <link rel="stylesheet" href="styles.css">
</head>
<body>
    <div class="background-blob blob-1"></div>
    <div class="background-blob blob-2"></div>
    <div class="background-blob blob-3"></div>

    <main class="container glass-panel">
        <header>
            <div class="logo">
                <i class="fa-solid fa-book-open"></i>
                <h1>Dictionary</h1>
            </div>
            <div class="theme-toggle">
                <input type="checkbox" id="theme-switch" class="theme-switch">
                <label for="theme-switch" class="theme-label">
                    <i class="fa-solid fa-sun"></i>
                    <i class="fa-solid fa-moon"></i>
                    <div class="toggle-ball"></div>
                </label>
            </div>
        </header>

        <section class="search-section">
            <form id="search-form" class="search-form">
                <div class="input-wrapper">
                    <i class="fa-solid fa-magnifying-glass search-icon"></i>
                    <input type="text" id="search-input" placeholder="Search for any word..." required autocomplete="off">
                    <button type="submit" class="search-btn">Search</button>
                </div>
            </form>
        </section>

        <div id="loader" class="loader hidden">
            <div class="spinner"></div>
            <p>Searching...</p>
        </div>

        <div id="error-message" class="error-message hidden">
            <i class="fa-regular fa-face-frown"></i>
            <h2 id="error-title">No Definitions Found</h2>
            <p id="error-resolution">Sorry pal, we couldn't find definitions for the word you were looking for. You can try the search again at a later time or head to the web instead.</p>
        </div>

        <article id="result-container" class="result-container hidden">
            <div class="word-header">
                <div class="word-title-wrap">
                    <h2 id="word-title">keyboard</h2>
                    <span id="word-phonetic">/ˈkiːbɔːd/</span>
                </div>
                <button id="play-audio-btn" class="play-btn hidden" aria-label="Play pronunciation">
                    <i class="fa-solid fa-play"></i>
                </button>
            </div>

            <div id="meanings-container" class="meanings-container">
                <!-- Meanings will be dynamically injected here -->
            </div>
            
            <hr class="divider">
            
            <div class="source-container hidden" id="source-container">
                <span class="source-label">Source</span>
                <a href="#" id="source-link" target="_blank" rel="noopener noreferrer">
                    <span class="link-text"></span>
                    <i class="fa-solid fa-arrow-up-right-from-square"></i>
                </a>
            </div>
        </article>
    </main>

    <script src="app.js"></script>
</body>
</html>
